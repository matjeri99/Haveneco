<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b2a"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>IHK Audit PWA</title></head><body>
<header><div><b>IHK AUDIT</b><span id="net">● online</span></div><button id="installBtn" hidden>Pasang App</button></header>
<main class="wrap">
<section id="home" class="view"><h1>Pilih Program Pemeriksaan</h1><p class="muted">Menu dan checklist akan berubah mengikut program.</p><div class="programs"><button data-program="MeSTI">MeSTI</button><button data-program="GMP" class="coming">GMP</button><button data-program="BeSS" class="coming">BeSS</button></div><div class="card"><h3>Audit Belum Selesai</h3><div id="draftInfo">Tiada draf.</div></div></section>
<section id="audit" class="view hidden"><div class="toprow"><button id="backHome" class="light">← Program</button><div><b id="programTitle">MeSTI</b><div class="muted" id="progressText"></div></div><button id="saveBtn">Simpan</button></div><div class="progress"><span id="progressBar"></span></div>
<div class="card meta"><div class="grid"><label>Premis<input id="premis"></label><label>Tarikh<input id="tarikh" type="date"></label><label>Auditor<input id="auditor"></label><label>Jenis Pemeriksaan<select id="jenis"><option>Rutin</option><option>Susulan</option><option>Aduan</option><option>Lain-lain</option></select></label></div></div>
<div id="sections"></div></section>
<section id="finding" class="drawer hidden"><div class="drawerbox"><button id="closeFinding" class="light">✕ Tutup</button><h2 id="findingCode"></h2><p id="findingQ"></p><div class="statusrow"><button data-st="Patuh">✓ Patuh</button><button data-st="Tidak Patuh" class="danger">✕ Tidak Patuh</button><button data-st="N/A" class="light">N/A</button></div><label>Penemuan / Bukti<textarea id="findingNote"></textarea></label><div id="npBlock" class="hidden"><label>Risk Based Item<select id="riskSelect"><option value="">-- pilih jika berkaitan --</option></select></label><label>Rujukan PPKM 2009<select id="legalSelect" multiple size="5"></select></label><label>Jenis Teguran/Arahan<select id="directiveType"><option>Teguran</option><option>Arahan Pembersihan</option><option>Arahan Pembetulan</option><option>Arahan Pembersihan & Pembetulan</option></select></label><label>Arahan / tindakan dikehendaki<textarea id="directiveText"></textarea></label><div class="grid"><label>Tempoh<select id="duePreset"><option value="0">Serta-merta</option><option value="1">24 jam</option><option value="3">3 hari</option><option value="7">7 hari</option><option value="14">14 hari</option><option value="30">30 hari</option><option value="custom">Tarikh khusus</option></select></label><label>Tarikh akhir<input type="date" id="dueDate"></label><label>Tarikh susulan<input type="date" id="followDate"></label></div><label><input type="checkbox" id="section10"> Punca kuasa arahan pembersihan: Seksyen 10(1), Akta Makanan 1983 — semak kesesuaian sebelum keluarkan arahan rasmi.</label></div><div class="bar"><button id="saveFinding">Simpan Penemuan</button></div></div></section>
<section id="summary" class="view hidden"></section>
</main><script src="app.js"></script></body></html>
